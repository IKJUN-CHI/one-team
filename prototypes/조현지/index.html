<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수리 견적 범위 확인표</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #fff; --ink: #222; --muted: #6b6b6b; --line: #ddd;
    --accent: #2f6f5e; --warn: #b4531c; --warn-bg: #fdf0e7; --info-bg: #eef4f2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height: 1.5; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: grid; gap: 8px; margin-bottom: 8px; align-items: center; }
  .damage-row { grid-template-columns: 110px 130px 1fr 36px; }
  .item-row { grid-template-columns: 1fr 110px 130px 1.3fr 120px 36px; }
  .head { font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; width: 100%; background: #fff; color: var(--ink); }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: #fff; color: var(--accent); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; }
  button.remove { padding: 4px; border-color: var(--line); color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .notice { background: var(--info-bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: .92rem; word-break: keep-all; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .8rem; }
  .badge { display: inline-block; background: var(--warn-bg); color: var(--warn); border-radius: 999px; padding: 1px 8px; font-size: .78rem; margin: 0 4px 4px 0; white-space: nowrap; }
  .none { color: var(--muted); }
  textarea { min-height: 220px; }
  #copyStatus { color: var(--accent); align-self: center; }
  .hidden { display: none; }
  @media (max-width: 720px) {
    .damage-row, .item-row { grid-template-columns: 1fr 1fr; }
    .damage-row .wide, .item-row .wide { grid-column: 1 / -1; }
    .grid-head { display: none; }
    .row { border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
  }
</style>
</head>
<body>
<main>
  <h1>수리 견적 범위 확인표</h1>
  <p class="sub">내가 기록한 피해와 받은 견적을 나란히 놓고, 업체에 물어볼 질문을 만듭니다. 입력한 내용은 이 브라우저 밖으로 나가지 않습니다.</p>

  <div class="actions" style="margin-bottom:16px">
    <button id="loadExample">예시 불러오기</button>
    <button id="reset">모두 지우기</button>
  </div>

  <section>
    <h2>1. 피해 기록</h2>
    <div class="row damage-row head grid-head"><span>공간</span><span>부위</span><span>피해 범위</span><span></span></div>
    <div id="damageList"></div>
    <div class="actions"><button id="addDamage">+ 피해 추가</button></div>
  </section>

  <section>
    <h2>2. 견적 항목</h2>
    <div class="row item-row head grid-head"><span>작업 내용</span><span>공간</span><span>부위</span><span>작업 범위</span><span>금액(원)</span><span></span></div>
    <div id="itemList"></div>
    <div class="actions"><button id="addItem">+ 견적 항목 추가</button></div>
  </section>

  <div class="actions" style="margin-bottom:16px"><button id="check" class="primary">확인하기</button></div>

  <section id="result" class="hidden">
    <div class="notice">가격과 범위가 적절한지 판단하지 않습니다. 확인할 질문만 만듭니다.</div>
    <h2>비교표</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>공간·부위</th><th>피해 범위</th><th>견적 항목</th><th>표시</th></tr></thead>
      <tbody id="compareBody"></tbody>
    </table></div>
    <h2 style="margin-top:20px">업체에 물어볼 질문</h2>
    <textarea id="questions" aria-label="업체에 물어볼 질문"></textarea>
    <div class="actions"><button id="copy" class="primary">질문 복사</button><span id="copyStatus"></span></div>
  </section>
</main>

<script>
const SPACES = ["현관", "거실", "안방", "작은방", "주방", "욕실", "베란다"];
const PARTS = ["천장", "벽", "바닥", "몰딩·걸레받이", "가구·가전", "기타"];
const VAGUE = ["전체", "일식", "일체"];

const EXAMPLE = {
  damages: [
    { space: "작은방", part: "천장", range: "물 얼룩, 지름 약 50cm" },
    { space: "작은방", part: "벽", range: "창쪽 벽 아래 30cm 정도 얼룩" },
  ],
  items: [
    { work: "도배", space: "작은방", part: "천장", scope: "천장 전체", amount: "180000" },
    { work: "도배", space: "작은방", part: "벽", scope: "4면 전체 도배", amount: "350000" },
    { work: "도배", space: "거실", part: "천장", scope: "일식", amount: "" },
  ],
};

const $ = (id) => document.getElementById(id);

function options(list, selected) {
  return list.map((v) => `<option${v === selected ? " selected" : ""}>${v}</option>`).join("");
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function addDamage(d = { space: "작은방", part: "천장", range: "" }) {
  const row = document.createElement("div");
  row.className = "row damage-row";
  row.innerHTML = `
    <select data-k="space" aria-label="공간">${options(SPACES, d.space)}</select>
    <select data-k="part" aria-label="부위">${options(PARTS, d.part)}</select>
    <input class="wide" data-k="range" placeholder="예: 창쪽 벽 아래 30cm 정도 얼룩" aria-label="피해 범위">
    <button class="remove" title="삭제" aria-label="삭제">✕</button>`;
  row.querySelector('[data-k="range"]').value = d.range;
  row.querySelector(".remove").onclick = () => row.remove();
  $("damageList").appendChild(row);
}

function addItem(it = { work: "", space: "작은방", part: "천장", scope: "", amount: "" }) {
  const row = document.createElement("div");
  row.className = "row item-row";
  row.innerHTML = `
    <input class="wide" data-k="work" placeholder="예: 도배" aria-label="작업 내용">
    <select data-k="space" aria-label="공간">${options(SPACES, it.space)}</select>
    <select data-k="part" aria-label="부위">${options(PARTS, it.part)}</select>
    <input class="wide" data-k="scope" placeholder="예: 4면 전체 도배" aria-label="작업 범위">
    <input data-k="amount" inputmode="numeric" placeholder="비워도 됨" aria-label="금액">
    <button class="remove" title="삭제" aria-label="삭제">✕</button>`;
  row.querySelector('[data-k="work"]').value = it.work;
  row.querySelector('[data-k="scope"]').value = it.scope;
  const amount = row.querySelector('[data-k="amount"]');
  amount.value = formatAmount(it.amount);
  amount.addEventListener("blur", () => { amount.value = formatAmount(amount.value); });
  row.querySelector(".remove").onclick = () => row.remove();
  $("itemList").appendChild(row);
}

function formatAmount(v) {
  const digits = String(v).replace(/[^0-9]/g, "");
  return digits ? Number(digits).toLocaleString("ko-KR") : "";
}

function readRows(listId) {
  return [...$(listId).children].map((row) => {
    const o = {};
    row.querySelectorAll("[data-k]").forEach((el) => { o[el.dataset.k] = el.value.trim(); });
    return o;
  });
}

// 받침이 있으면 "은", 없으면 "는"
function topic(word) {
  const code = word.charCodeAt(word.length - 1);
  if (code < 0xac00 || code > 0xd7a3) return word + "은(는)";
  return word + ((code - 0xac00) % 28 ? "은" : "는");
}

function isVague(scope) {
  return scope === "" || VAGUE.includes(scope.replace(/\s/g, ""));
}

function check() {
  const damages = readRows("damageList").filter((d) => d.range !== "");
  const items = readRows("itemList").filter((it) => it.work || it.scope || it.amount);

  const places = [];
  const placeOf = (o) => `${o.space} ${o.part}`;
  [...damages, ...items].forEach((o) => { if (!places.includes(placeOf(o))) places.push(placeOf(o)); });

  const questions = [];
  const rowsHtml = places.map((place) => {
    const ds = damages.filter((d) => placeOf(d) === place);
    const its = items.filter((it) => placeOf(it) === place);
    const badges = [];

    if (ds.length && !its.length) {
      badges.push("견적에 빠진 피해");
      questions.push(`${place} 피해는 견적에 없는데, 수리하지 않아도 되나요?`);
    }
    if (its.length && !ds.length) {
      badges.push("피해 기록에 없는 곳");
      questions.push(`${topic(place)} 피해 기록에 없는데, 왜 작업이 필요한가요?`);
    }
    its.forEach((it) => {
      const name = `${place} ${it.work || "작업"}`;
      if (ds.length) {
        badges.push("범위 확인 필요");
        const dRange = ds.map((d) => d.range).join(", ");
        questions.push(`${place}: 피해는 '${dRange}'인데 견적은 '${it.scope || "(적지 않음)"}'입니다. 이 범위까지 교체해야 하는 이유가 무엇인가요?`);
      }
      if (isVague(it.scope)) {
        badges.push("범위가 불분명");
        questions.push(`${name}의 범위를 면적(㎡)이나 면 수로 알려주실 수 있나요?`);
      }
      if (!it.amount) {
        badges.push("금액 내역 없음");
        questions.push(`${name}의 금액을 따로 알려주실 수 있나요?`);
      }
    });

    const dCell = ds.length ? ds.map((d) => escapeHtml(d.range)).join("<br>") : '<span class="none">기록 없음</span>';
    const iCell = its.length
      ? its.map((it) => `${escapeHtml(it.work || "작업")} · ${escapeHtml(it.scope || "(범위 없음)")} · ${it.amount ? escapeHtml(it.amount) + "원" : "금액 없음"}`).join("<br>")
      : '<span class="none">견적 없음</span>';
    const bCell = [...new Set(badges)].map((b) => `<span class="badge">${b}</span>`).join("") || '<span class="none">-</span>';
    return `<tr><td>${escapeHtml(place)}</td><td>${dCell}</td><td>${iCell}</td><td>${bCell}</td></tr>`;
  });

  $("compareBody").innerHTML = rowsHtml.join("") || '<tr><td colspan="4" class="none">피해 기록이나 견적 항목을 먼저 입력해 주세요.</td></tr>';
  $("questions").value = questions.length
    ? "견적 관련해서 확인하고 싶은 점이 있습니다.\n\n" + questions.map((q, i) => `${i + 1}. ${q}`).join("\n")
    : "";
  $("copyStatus").textContent = "";
  $("result").classList.remove("hidden");
  $("result").scrollIntoView({ behavior: "smooth" });
}

async function copyQuestions() {
  const text = $("questions").value;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    $("questions").select();
    document.execCommand("copy");
  }
  $("copyStatus").textContent = "복사했습니다.";
}

function clearAll() {
  $("damageList").innerHTML = "";
  $("itemList").innerHTML = "";
  $("result").classList.add("hidden");
}

$("addDamage").onclick = () => addDamage();
$("addItem").onclick = () => addItem();
$("check").onclick = check;
$("copy").onclick = copyQuestions;
$("reset").onclick = () => { clearAll(); addDamage(); addItem(); };
$("loadExample").onclick = () => {
  clearAll();
  EXAMPLE.damages.forEach(addDamage);
  EXAMPLE.items.forEach(addItem);
};

addDamage();
addItem();
</script>
</body>
</html>
